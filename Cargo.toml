[package]
name = "xls2sql"
version = "3.0.0"
edition = "2021"
description = "Convert Excel/CSV files into T-SQL INSERT / CREATE TABLE scripts"

[dependencies]
eframe = "0.29"
calamine = { version = "0.38", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
csv = "1.3"
encoding_rs = "0.8"
rfd = "0.15"
rayon = "1.10"
mimalloc = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
